<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" role="img" aria-label="sortmy.london mark" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <style>
    /* Arc 026 row 1: the real sortmy.london "sort" glyph replaces the placeholder "qte77 mark" — a
       vertical line with an up-chevron top / down-chevron bottom, two arrows, one each direction,
       echoing "sortmy". Design source: Claude Design project b8ac2137-75ac-4283-b730-3da64859a2f4,
       file SortMyLondon.dc.html (stroke, no fill, viewBox 0 0 40 40, stroke-width 1.6) — re-pulled
       2026-09-19. The mark tracks --color-primary in its respective scheme (dark shown by default,
       light overridden below); a standalone favicon SVG has no access to the host page's CSS custom
       properties, so the two hex values are copied verbatim — same mechanism the prior mark used. No
       background tile — the design's own swatch is transparent, letting the browser's own tab-chrome
       background show through. */
    .mark { stroke: #7f96e9; }
    @media (prefers-color-scheme: light) {
      .mark { stroke: #2f4cc9; }
    }
  </style>
  <path class="mark" d="M20 5v30M13 12l7-7 7 7M13 28l7 7 7-7" />
</svg>
