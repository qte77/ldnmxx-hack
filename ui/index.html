<!doctype html>
<html lang="en">
  <head>
    <!-- Anti-FOUC theme init — external (not inline) so the page CSP stays strict (script-src
         'self'). Blocking in <head>, so it still runs before first paint. Arc 024 dropped the
         3-variant system (and its variant-init.js sibling) — theme-init.js already handles the
         system/light/dark cases the Settings Appearance control needs. -->
    <script src="/theme-init.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://sortmy.london/" />
    <!-- Perf: Lora 400 (body text) is the highest-traffic font — used everywhere, unlike the lower-
         traffic Cormorant Garamond 600 / Lora 600 / JetBrains Mono. Preloading it cuts FOUT/layout
         shift on first paint. The hashed filename is content-derived by Vite (stable across builds
         while the @fontsource/lora package version is unchanged) — if a font-package bump ever
         changes it, this preload silently stops matching and the optimization is lost, not broken;
         re-run `npm run build` and update the hash here when that happens. -->
    <link
      rel="preload"
      href="/assets/lora-latin-400-normal-DnxXpLNu.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- The one hex that cannot be a token: a meta attribute takes no var(). Keep in sync with
         --color-primary's light-scheme value in ui/src/tokens.css. -->
    <meta name="theme-color" content="#2f4cc9" />
    <title>sortmy.london — ask in your own words, get the official source</title>
    <meta
      name="description"
      content="Ask about London public services in your own words — we point you to the official record. Free, no sign-up, no cookies. A weekly snapshot of official registers, each result linking to the live page."
    />
    <!-- Open Graph / Twitter -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="sortmy.london" />
    <meta property="og:url" content="https://sortmy.london/" />
    <meta property="og:title" content="sortmy.london — ask in your own words, get the official source" />
    <meta
      property="og:description"
      content="Ask about London public services in your own words — we point you to the official record. Free, no sign-up, no cookies."
    />
    <meta property="og:image" content="https://sortmy.london/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="sortmy.london — ask in your own words, get the official source" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="sortmy.london — ask in your own words, get the official source" />
    <meta
      name="twitter:description"
      content="Ask about London public services in your own words — we point you to the official record. Free, no sign-up, no cookies."
    />
    <meta name="twitter:image" content="https://sortmy.london/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
