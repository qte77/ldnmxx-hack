---
# CodeQL security analysis for the repo's current stack: ui/ + worker/ (TypeScript) AND ingest/
# (Python) — a matrix, not a single language, so a new interpreted language added to any of the three
# subdirs (AGENTS.md "Clean root" convention) is a one-line matrix addition, not a rewrite. Both
# languages are interpreted, so build-mode: none (the current non-deprecated setting, set per-matrix-
# entry below) replaces the old separate autobuild step entirely. Actions are SHA-pinned (repo policy:
# allowed_actions=selected + sha_pinning_required); github/* + actions/* are github-owned (allowed).
# https://github.blog/changelog/2025-10-28-upcoming-deprecation-of-codeql-action-v3/
name: "CodeQL"

on:
  push:
  schedule:
    - cron: '27 11 * * 0'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          category: "/language:${{ matrix.language }}"
...
