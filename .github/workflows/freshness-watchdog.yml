# Freshness watchdog (#199): alert if the 04:47 UTC ingest cron silently dies and D1 serves stale
# data invisibly. CREDENTIAL-FREE — it GETs the public read-only https://sortmy.london/api/freshness
# endpoint (worker/src/freshness.ts) and never holds a Cloudflare token, mirroring tier3-monitor.yml
# ("only hits the public URL"). A stale/missing corpus fails the run and opens (or comments on) one
# alert issue; recovery-close is deliberately left to a human (KISS, matches tier3-monitor).
name: Freshness Watchdog
on:
  schedule:
    - cron: "37 6 * * *" # daily, ~2h after the 04:47 UTC ingest cron so a missed swap is caught same-day
  workflow_dispatch:
    inputs:
      max_age_hours:
        description: "Staleness threshold in hours (dispatch with 0 to exercise the stale/alert path)"
        type: string
        required: false
        default: "48"

permissions:
  contents: read
  issues: write

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Scheduled runs use the 48h default; a dispatch may override (e.g. 0 to prove the alert path).
      MAX_AGE_HOURS: ${{ github.event.inputs.max_age_hours || '48' }}
    steps:
      - name: Fetch freshness from the public endpoint
        # -sSf fails the step loudly on any non-2xx (endpoint/site down) rather than parsing an error body.
        run: curl -sSf https://sortmy.london/api/freshness -o /tmp/freshness.json

      - name: Evaluate freshness
        id: evaluate
        run: |
          set -euo pipefail
          # Validate the (write-access-only) dispatch input before it reaches arithmetic — a bad
          # value can only be a non-negative integer, never a shell/arithmetic footgun.
          case "$MAX_AGE_HOURS" in
            '' | *[!0-9]*)
              echo "::error::max_age_hours must be a non-negative integer (got '$MAX_AGE_HOURS')"
              exit 1 ;;
          esac
          now="$(date -u +%s)"
          threshold=$(( MAX_AGE_HOURS * 3600 ))
          count="$(jq '(.corpora // []) | length' /tmp/freshness.json)"

          stale=""
          {
            echo "## Freshness watchdog"
            echo ""
            echo "Threshold: **${MAX_AGE_HOURS}h** · corpora tracked: **${count}**"
            echo ""
            echo "| corpus | ingestedAt (UTC) | age (h) | status |"
            echo "| --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$count" -eq 0 ]; then
            echo "| _(none)_ | — | — | ❌ empty corpus_meta |" >> "$GITHUB_STEP_SUMMARY"
            stale="corpus_meta-empty"
          else
            while IFS=$'\t' read -r corpus ingested; do
              if [ -z "$ingested" ] || [ "$ingested" = "null" ]; then
                echo "| \`$corpus\` | (missing) | — | ❌ no ingestedAt |" >> "$GITHUB_STEP_SUMMARY"
                stale="${stale:+$stale, }$corpus"
                continue
              fi
              ts="$(date -u -d "$ingested" +%s)"
              age=$(( now - ts ))
              age_h=$(( age / 3600 ))
              if [ "$age" -gt "$threshold" ]; then
                echo "| \`$corpus\` | $ingested | ${age_h} | ❌ stale |" >> "$GITHUB_STEP_SUMMARY"
                stale="${stale:+$stale, }$corpus"
              else
                echo "| \`$corpus\` | $ingested | ${age_h} | ✅ fresh |" >> "$GITHUB_STEP_SUMMARY"
              fi
            done < <(jq -r '.corpora[] | [.corpus, (.ingestedAt // "null")] | @tsv' /tmp/freshness.json)
          fi

          if [ -n "$stale" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "stale_list=$stale" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Alert on stale (open or update the alert issue), then fail
        if: steps.evaluate.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # This job has no actions/checkout (credential-free, curl-only), so gh has no local git repo
          # to infer from — GH_REPO points the issue commands at the right repo without a checkout.
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STALE_LIST: ${{ steps.evaluate.outputs.stale_list }}
        run: |
          title="Freshness watchdog: corpus data is STALE"
          body="The ingest cron may have stalled — stale/missing corpora: ${STALE_LIST} (threshold ${MAX_AGE_HOURS}h). See ${RUN_URL} for the per-corpus table. Check the 04:47 UTC ingest cron + the corpus-data release."
          n="$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "Still stale: ${STALE_LIST} — ${RUN_URL}"
          else
            gh issue create --title "$title" --body "$body"
          fi
          echo "::error::Stale corpora: ${STALE_LIST}"
          exit 1
