---
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      # Security fixes get their OWN group — they bypass the weekly schedule/cooldown and land as one
      # bundled PR the moment an advisory lands, instead of one-PR-per-CVE (17 separate alerts across
      # worker/ alone, 2026-09). `update-types`/`dependency-type` aren't valid on a security-updates
      # group (Dependabot rejects the config) — `patterns` is the only filter it supports.
      npm-security:
        applies-to: "security-updates"
        patterns: ["*"]
      npm:
        applies-to: "version-updates"
        patterns: ["*"]
    labels: ["dependencies", "npm"]
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # AI-SDK majors break the browser-BYOK live-agent path (streamText / tool-call shapes) — handled
      # in a deliberate migration PR, not an auto-bump.
      - dependency-name: "ai"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@ai-sdk/openai"
        update-types: ["version-update:semver-major"]
      # @a2ui/react is 0.x, so a breaking renderer/protocol change can ship as a 0.x MINOR. Ignore both
      # so it's a deliberate migration PR, not an auto-bump (same rationale as the AI-SDK above). Patch
      # bumps still flow — CI's real-renderer test guards them.
      - dependency-name: "@a2ui/react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # typescript-eslint can't parse TS 7 yet — worker+ui stay aligned on TS 6 (AGENTS.md gotcha;
      # #153's ui job failed exactly here: ERESOLVE typescript-eslint@8.64 vs typescript@7). Unignore
      # when typescript-eslint supports TS 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # zod is deliberately held at ^3 to match @a2ui/react's peer range — one deduped copy, measured
      # −17.9 KB gzip (engineering-practices · Performance). A v4 move is a deliberate migration with
      # the renderer, not an auto-bump.
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]
      # vitest 5 was deferred (2026-09) rather than auto-bumped — it kept riding along in the grouped
      # npm PR, forcing a close-and-regenerate every week to get the OTHER safe minors/patches out.
      # Ignoring the major here lets the group stay mergeable; revisit as its own migration PR.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      # react-dom 19.3.0's production client bundle grew ~17% (536KB -> 625KB raw; new
      # <ViewTransition/>/addTransitionType, Fragment refs, independently-rendering transitions —
      # core reconciler code, not tree-shakeable) — enough to blow the gzip budget
      # (check-bundle-size.mjs). Pinned to this ONE version, not a blanket minor-ignore: react/react-dom
      # patches and the NEXT minor should still flow normally; only 19.3.0 needs a deliberate decision
      # (raise the ceiling, or accept it) before it lands. Revisit/remove once that decision is made.
      - dependency-name: "react"
        versions: ["19.3.0"]
      - dependency-name: "react-dom"
        versions: ["19.3.0"]
  - package-ecosystem: "npm"
    directory: "/worker"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      npm-security:
        applies-to: "security-updates"
        patterns: ["*"]
      npm:
        applies-to: "version-updates"
        patterns: ["*"]
    labels: ["dependencies", "npm"]
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # wrangler@4 peer-pins @cloudflare/workers-types to ^4; the v5 major conflicts (ERESOLVE).
      - dependency-name: "@cloudflare/workers-types"
        update-types: ["version-update:semver-major"]
      # typescript-eslint can't parse TS 7 yet — worker+ui stay aligned on TS 6 (AGENTS.md gotcha).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Same vitest-5 deferral as ui/'s ignore above — see that comment.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions-security:
        applies-to: "security-updates"
        patterns: ["*"]
      github-actions:
        applies-to: "version-updates"
        patterns: ["*"]
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "chore(ci)"
...
